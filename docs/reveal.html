<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reveal sequence preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Fredoka',system-ui,sans-serif;}
  #stage{position:relative;height:100vh;overflow:hidden;
         background:url('../src/assets/theme-bg.jpg') center/cover;}
  #veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.35),rgba(255,255,255,.08));}

  #count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;}
  #count .num{font-weight:700;font-size:34vh;line-height:1;
              background:linear-gradient(160deg,#ff8fb8,#7fbaff);-webkit-background-clip:text;background-clip:text;color:transparent;
              text-shadow:0 8px 30px rgba(255,255,255,.5);}
  .tick{animation:pop 1s ease-out forwards;}
  @keyframes pop{
    0%{transform:scale(.3);opacity:0;}
    25%{transform:scale(1.08);opacity:1;}
    70%{transform:scale(1);opacity:1;}
    100%{transform:scale(.7);opacity:0;}
  }
  .ring{position:absolute;width:44vh;height:44vh;border-radius:50%;border:3px solid rgba(255,255,255,.7);
        left:50%;top:50%;transform:translate(-50%,-50%);animation:ringpulse 1s ease-out infinite;}
  @keyframes ringpulse{0%{transform:translate(-50%,-50%) scale(.6);opacity:.9;}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0;}}

  #balloons{position:absolute;inset:0;pointer-events:none;z-index:3;}
  .b-wrap{position:absolute;bottom:-24vh;animation:rise linear forwards;}
  @keyframes rise{to{transform:translateY(-135vh);}}
  .balloon{position:relative;width:66px;height:82px;border-radius:50% 50% 49% 49%;
           animation:sway ease-in-out infinite alternate;transform-origin:center bottom;
           box-shadow:inset -8px -10px 14px rgba(0,0,0,.06), 0 6px 14px rgba(120,100,140,.18);}
  .balloon::after{content:"";position:absolute;top:12px;left:14px;width:16px;height:22px;border-radius:50%;
                  background:rgba(255,255,255,.6);filter:blur(1px);}
  .balloon::before{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
                   border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid;}
  .string{position:absolute;left:50%;top:82px;width:1px;height:70px;background:rgba(180,160,190,.5);transform:translateX(-50%);}
  @keyframes sway{from{transform:rotate(-7deg) translateX(-6px);}to{transform:rotate(7deg) translateX(6px);}}

  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       z-index:6;opacity:0;transform:scale(.6);transition:opacity .5s ease, transform .6s cubic-bezier(.18,1.5,.5,1);text-align:center;padding:20px;}
  #msg.show{opacity:1;transform:scale(1);}
  #msg .big{font-weight:700;font-size:12vw;line-height:1.05;color:#fff;
            text-shadow:0 6px 26px rgba(150,120,160,.45);}
  #msg .sub{font-weight:500;font-size:4.4vw;color:#fff;opacity:.95;margin-top:6px;text-shadow:0 3px 14px rgba(150,120,160,.4);}
  #tint{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .8s ease;}
  #tint.girl{background:radial-gradient(circle at 50% 55%,rgba(255,120,175,.35),rgba(255,120,175,.12));opacity:1;}
  #tint.boy{background:radial-gradient(circle at 50% 55%,rgba(74,168,255,.35),rgba(74,168,255,.12));opacity:1;}

  #ctrl{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;
        background:rgba(255,255,255,.8);backdrop-filter:blur(8px);padding:10px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(120,100,140,.28);}
  #ctrl button{font-family:'Fredoka';font-weight:600;font-size:15px;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;color:#5b4a63;}
  #ctrl .girl{background:linear-gradient(135deg,#ffc2dc,#ff9ec4);}
  #ctrl .boy{background:linear-gradient(135deg,#bfe0ff,#8ec5ff);}
  #ctrl .replay{background:#efe9f4;color:#8a8296;}
</style>
</head>
<body>
  <div id="stage">
    <div id="veil"></div>
    <div id="tint"></div>
    <div id="balloons"></div>
    <div id="count"></div>
    <div id="msg"><div class="big"></div><div class="sub"></div></div>
  </div>
  <div id="ctrl">
    <button class="girl" onclick="play('girl')">▶ Reveal a Girl 💖</button>
    <button class="boy" onclick="play('boy')">▶ Reveal a Boy 💙</button>
    <button class="replay" onclick="play(last)">↻ Replay</button>
  </div>

<script>
  const countEl=document.getElementById('count');
  const balloonsEl=document.getElementById('balloons');
  const msg=document.getElementById('msg');
  const tint=document.getElementById('tint');
  let last='girl', timers=[];
  const PINKS=['#ffb3d1','#ff9ec4','#ffc9de'], BLUES=['#a9d8ff','#8ec5ff','#c7e6ff'], NEUTRAL=['#fff4f9','#f3f7ff','#ffe8b0'];

  function clearAll(){timers.forEach(clearTimeout);timers=[];countEl.innerHTML='';balloonsEl.innerHTML='';
    msg.className='';msg.querySelector('.big').textContent='';msg.querySelector('.sub').textContent='';tint.className='';}
  function T(fn,ms){timers.push(setTimeout(fn,ms));}

  function showNum(n){countEl.innerHTML='<div class="ring"></div><div class="num tick">'+n+'</div>';}

  function makeBalloon(gender){
    const wrap=document.createElement('div');wrap.className='b-wrap';
    const pool=gender==='girl'?PINKS.concat(NEUTRAL):BLUES.concat(NEUTRAL);
    const color=pool[Math.floor(Math.random()*pool.length)];
    const size=48+Math.random()*46;
    wrap.style.left=(Math.random()*96)+'vw';
    const dur=4.5+Math.random()*3.5;
    wrap.style.animationDuration=dur+'s';
    const b=document.createElement('div');b.className='balloon';
    b.style.background=color;b.style.color=color;b.style.width=size+'px';b.style.height=(size*1.24)+'px';
    b.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    b.appendChild(Object.assign(document.createElement('div'),{className:'string'}));
    wrap.appendChild(b);balloonsEl.appendChild(wrap);
    T(()=>wrap.remove(),dur*1000+200);
  }

  function burst(gender){
    if(typeof confetti!=='function')return;
    const colors=gender==='girl'?['#ff6fae','#ff9ec4','#ffd1e6','#ffe8b0']:['#4aa8ff','#8ec5ff','#cbe6ff','#ffe8b0'];
    const end=Date.now()+1400;
    (function frame(){
      confetti({particleCount:5,angle:60,spread:70,origin:{x:0,y:.9},colors});
      confetti({particleCount:5,angle:120,spread:70,origin:{x:1,y:.9},colors});
      if(Date.now()<end)requestAnimationFrame(frame);
    })();
    confetti({particleCount:140,spread:100,origin:{y:.6},colors,scalar:1.1});
  }

  function reveal(gender){
    tint.className=gender;
    for(let i=0;i<26;i++) T(()=>makeBalloon(gender), i*120);
    burst(gender);
    msg.querySelector('.big').textContent=gender==='girl'?"It's a Girl! 💖":"It's a Boy! 💙";
    msg.querySelector('.sub').textContent="Twinkle twinkle — now we know what you are ✨";
    msg.className=gender;
    requestAnimationFrame(()=>msg.classList.add('show'));
  }

  function play(gender){
    last=gender;clearAll();
    let n=5; showNum(n);
    const step=()=>{n--; if(n>=1){showNum(n);T(step,1000);} else {countEl.innerHTML='';reveal(gender);}};
    T(step,1000);
  }
  window.addEventListener('load',()=>T(()=>play('girl'),400));
</script>
</body>
</html>
